# کارام — بیلد اپ اندروید روی GitHub Actions (فاز ۶ + بیلد دوگانه)
# خروجی‌ها (هر دو امضاشده با همان keystore، همان applicationId و همان versionCode):
#   ۱) karam-latest.apk  — حالت پیش‌فرض (پرداخت روشن) — برای سایت و به‌روزرسانی اپ
#   ۲) karam-bazaar.apk  — حالت bazaar (BUILD_MODE=bazaar → VITE_PAYMENTS_BUILD=off
#                          یعنی کل UI پرداخت از باندل حذف) — فقط برای آپلود در کافه‌بازار
# به‌علاوه APK دیباگ (برای نصب و تست روی گوشی) از حالت پیش‌فرض.
# اجرا: خودکار با هر پوش روی main (یا مسیرهای مرتبط)، یا دستی از تب Actions → Run workflow

name: بیلد اندروید کارام

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK دوگانه (latest + bazaar)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: نصب وابستگی‌های فرانت
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: نصب وابستگی‌های موبایل
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: نصب Java 21 (Temurin) + کش Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: پذیرش لایسنس‌های Android SDK
        run: |
          if [ -d "$ANDROID_HOME/licenses" ] && [ -n "$(ls -A "$ANDROID_HOME/licenses" 2>/dev/null)" ]; then
            echo 'لایسنس‌ها از قبل فعال است'
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: رمزگشایی کلید امضا از Secret (در صورت وجود)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/karam-release.jks"
            echo "KARAM_SIGNING=true" >> "$GITHUB_ENV"
            echo 'کلید امضا آماده شد — هر دو Release امضاشده بیلد می‌شوند'
          else
            echo "KARAM_SIGNING=false" >> "$GITHUB_ENV"
            echo 'ℹ️ Secret کلید امضا تنظیم نشده — Release بدون امضا بیلد می‌شود'
          fi

      # ---------- ۱) حالت پیش‌فرض (پرداخت روشن) → karam-latest.apk ----------
      - name: ساخت بسته‌ی وب — حالت پیش‌فرض (پرداخت روشن)
        working-directory: mobile
        run: bun run build:www

      - name: همگام‌سازی Capacitor — حالت پیش‌فرض
        working-directory: mobile
        run: bunx cap sync android

      - name: بیلد APK حالت پیش‌فرض (Debug + Release)
        working-directory: mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          GRADLE_ARGS="assembleDebug assembleRelease --no-daemon --stacktrace"
          if [ "$KARAM_SIGNING" = "true" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PkaramKeystoreFile=$HOME/karam-release.jks -PkaramKeystorePassword=$KS_PASSWORD -PkaramKeyAlias=$KS_ALIAS -PkaramKeyPassword=$KS_KEY_PASSWORD"
          fi
          ./gradlew $GRADLE_ARGS

      - name: نگه‌داری خروجی حالت پیش‌فرض با نام نهایی
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/release/app-release*.apk mobile/dist/karam-latest.apk
          echo 'karam-latest.apk (حالت پیش‌فرض — پرداخت روشن) آماده شد'

      # ---------- ۲) حالت bazaar (بدون پرداخت) → karam-bazaar.apk ----------
      - name: ساخت بسته‌ی وب — حالت bazaar (پرداخت حذف از باندل)
        working-directory: mobile
        run: bun run build:www:bazaar

      - name: همگام‌سازی Capacitor — حالت bazaar
        working-directory: mobile
        run: bunx cap sync android

      - name: بیلد APK حالت bazaar (فقط Release)
        working-directory: mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # خروجی قبلی را پاک کن تا مطمئن شویم فایل این حالت است (نه باقی‌مانده‌ی حالت قبل)
          rm -f app/build/outputs/apk/release/app-release*.apk
          GRADLE_ARGS="assembleRelease --no-daemon --stacktrace"
          if [ "$KARAM_SIGNING" = "true" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PkaramKeystoreFile=$HOME/karam-release.jks -PkaramKeystorePassword=$KS_PASSWORD -PkaramKeyAlias=$KS_ALIAS -PkaramKeyPassword=$KS_KEY_PASSWORD"
          fi
          ./gradlew $GRADLE_ARGS

      - name: نگه‌داری خروجی حالت bazaar با نام نهایی
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release*.apk mobile/dist/karam-bazaar.apk
          echo 'karam-bazaar.apk (حالت bazaar — بدون پرداخت) آماده شد'

      - name: خلاصه‌ی خروجی‌ها
        run: |
          ls -lh mobile/dist/
          echo 'هر دو APK از یک گریدل و یک کلید امضا بیلد شده‌اند (applicationId و versionCode یکسان).'

      - name: آپلود karam-latest.apk (پیش‌فرض — برای سایت و به‌روزرسانی)
        uses: actions/upload-artifact@v4
        with:
          name: karam-latest-apk
          path: mobile/dist/karam-latest.apk
          if-no-files-found: error

      - name: آپلود karam-bazaar.apk (نسخه‌ی بازار — بدون پرداخت)
        uses: actions/upload-artifact@v4
        with:
          name: karam-bazaar-apk
          path: mobile/dist/karam-bazaar.apk
          if-no-files-found: error

      - name: آپلود APK دیباگ (برای تست روی گوشی — از حالت پیش‌فرض)
        uses: actions/upload-artifact@v4
        with:
          name: karam-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

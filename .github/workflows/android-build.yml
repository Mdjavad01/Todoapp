# کارام — بیلد اپ اندروید روی GitHub Actions (فاز ۶ + بیلد دوگانه)
# خروجی‌ها (هر دو امضاشده با همان keystore، همان applicationId و همان versionCode):
#   ۱) karam-latest.apk  — حالت پیش‌فرض (پرداخت روشن) — برای سایت و به‌روزرسانی اپ
#   ۲) karam-bazaar.apk  — حالت bazaar (BUILD_MODE=bazaar → VITE_PAYMENTS_BUILD=off
#                          یعنی کل UI پرداخت از باندل حذف) — فقط برای آپلود در کافه‌بازار
# به‌علاوه APK دیباگ (برای نصب و تست روی گوشی) از حالت پیش‌فرض.
# اجرا: خودکار با هر پوش روی main (یا مسیرهای مرتبط)، یا دستی از تب Actions → Run workflow

name: بیلد اندروید کارام

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK دوگانه (latest + bazaar)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      # v1.12.2 — منع باینری‌های APK/AAB در مخزن (fail-loud): خروجی بیلد فقط در آرتیفکت CI زندگی می‌کند؛
      # باینری کهنه در گیت کهنه می‌شود و خطر آپلود اشتباه به بازار دارد — هر یافته = شکست workflow
      - name: منع APK/AAB در مخزن (fail-loud)
        run: |
          TRACKED=$(git ls-files '*.apk' '*.aab')
          if [ -n "$TRACKED" ]; then
            echo '✗ فایل‌های APK/AAB در گیت ردیابی شده‌اند — بیلد رد شد (فایل ارسالی به بازار فقط آرتیفکت CI با نام karam-bazaar-apk است):' >&2
            echo "$TRACKED" >&2
            exit 1
          fi
          echo '✅ هیچ فایل APK/AAB در گیت ردیابی نمی‌شود'

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: نصب وابستگی‌های فرانت
        working-directory: frontend
        run: bun install --frozen-lockfile

      # v1.12.0 (ممیزی M-08) — سد تست پیش از هر بیلد: شکست تست = شکست workflow و هیچ APK ای ساخته نمی‌شود
      - name: اجرای تست‌های واحد فرانت (سد CI — ۳۱۵+ تست)
        working-directory: frontend
        run: bun test

      # v1.12.0 (ممیزی M-08 — توصیه‌شده) — تست‌های PHP روی sqlite
      # تا تأیید اولین اجرا در CI گارد باز است (continue-on-error)؛ بعد از سبزشدن، hard-gate شود
      - name: نصب PHP 8.2 با pdo_sqlite (تست بک‌اند)
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, json
          coverage: none

      - name: اجرای تست‌های PHP (trust + otp-no-disk — sqlite)
        if: runner.os == 'Linux'
        run: |
          SECRET=$(openssl rand -hex 32)
          # v1.12.1 — کلیدهای سقف OTP با مقادیر محیط سبزِ محلی هم‌خوان شدند؛ بدون آن‌ها
          # پیش‌فرض OTP_RESEND_AFTER=60s درخواست دوم loginEmail را رد می‌کند → توکن خالی
          # → FOREIGN KEY در trust-test:265 (شکست پنهان زیر continue-on-error تا v1.12.0)
          printf 'APP_ENV="local"\nAPP_SECRET="%s"\nOTP_DEBUG="1"\nOTP_TTL_MINUTES="5"\nOTP_RESEND_AFTER="1"\nOTP_MAX_ATTEMPTS="3"\nOTP_MAX_PER_HOUR="10"\nOTP_MAX_PER_IP_HOUR="500"\nDB_DRIVER="sqlite"\nSQLITE_PATH="%s/backend/storage/karam-ci.sqlite3"\nMAIL_TRANSPORT="log"\n' "$SECRET" "$GITHUB_WORKSPACE" > backend/.env
          php -S 127.0.0.1:8099 -t backend/public >/tmp/php-server.log 2>&1 &
          sleep 2
          php tests/otp-no-disk-test.php
          php tests/trust-test.php

      # موج ۱ چندروش ورود — تست یکپارچه‌ی رفع ریشه‌ی تلگرام با مک تلگرام
      # (env اختصاصی + ری‌استارت سرور: Config در هر پروسه یک‌بار .env را می‌خواند)
      - name: اجرای تست موج ۱ چندروش ورود (مک تلگرام — sqlite)
        if: runner.os == 'Linux'
        run: |
          SECRET=$(openssl rand -hex 32)
          printf 'APP_ENV="local"\nAPP_SECRET="%s"\nOTP_DEBUG="1"\nOTP_TTL_MINUTES="5"\nOTP_RESEND_AFTER="1"\nOTP_MAX_ATTEMPTS="3"\nOTP_MAX_PER_HOUR="10"\nOTP_MAX_PER_IP_HOUR="500"\nOTP_TICKET_MAX_SEND_ATTEMPTS="3"\nDB_DRIVER="sqlite"\nSQLITE_PATH="%s/backend/storage/karam-wave1.sqlite3"\nMAIL_TRANSPORT="log"\nTELEGRAM_BOT_TOKEN="123456:WAVE1LOCALTESTtoken"\nTELEGRAM_BOT_USERNAME="KaramWave1Bot"\nTELEGRAM_API_BASE="http://127.0.0.1:8098"\n' "$SECRET" "$GITHUB_WORKSPACE" > backend/.env
          rm -f backend/storage/karam-wave1.sqlite3 backend/storage/cache/telegram-updates.json
          pkill -f "php -S 127.0.0.1:8099" || true
          sleep 1
          php -S 127.0.0.1:8098 tests/telegram-mock.php >/tmp/tg-mock.log 2>&1 &
          php -S 127.0.0.1:8099 -t backend/public >/tmp/php-server-wave1.log 2>&1 &
          sleep 2
          php tests/multi-login-wave1-test.php || { echo '--- php-error.log (ریشه‌یابی) ---'; tail -40 backend/storage/logs/php-error.log || true; exit 1; }

      # موج ۲ چندروش ورود — تست یکپارچه‌ی اتصال روش دوم (ایمیل/تلگرام) به حساب
      # (همان مک تلگرام گام قبل؛ env اختصاصی + ری‌استارت سرور: Config در هر پروسه یک‌بار .env را می‌خواند)
      - name: اجرای تست موج ۲ اتصال روش دوم (مک تلگرام — sqlite)
        if: runner.os == 'Linux'
        run: |
          SECRET=$(openssl rand -hex 32)
          printf 'APP_ENV="local"\nAPP_SECRET="%s"\nOTP_DEBUG="1"\nOTP_TTL_MINUTES="5"\nOTP_RESEND_AFTER="1"\nOTP_MAX_ATTEMPTS="3"\nOTP_MAX_PER_HOUR="10"\nOTP_MAX_PER_IP_HOUR="500"\nOTP_TICKET_MAX_SEND_ATTEMPTS="3"\nDB_DRIVER="sqlite"\nSQLITE_PATH="%s/backend/storage/karam-wave2.sqlite3"\nMAIL_TRANSPORT="log"\nTELEGRAM_BOT_TOKEN="123456:WAVE1LOCALTESTtoken"\nTELEGRAM_BOT_USERNAME="KaramWave1Bot"\nTELEGRAM_API_BASE="http://127.0.0.1:8098"\n' "$SECRET" "$GITHUB_WORKSPACE" > backend/.env
          rm -f backend/storage/karam-wave2.sqlite3 backend/storage/cache/telegram-updates.json
          pkill -f "php -S 127.0.0.1:8099" || true
          sleep 1
          php -S 127.0.0.1:8099 -t backend/public >/tmp/php-server-wave2.log 2>&1 &
          sleep 2
          php tests/multi-login-wave2-test.php || { echo '--- php-error.log (ریشه‌یابی) ---'; tail -40 backend/storage/logs/php-error.log || true; exit 1; }

      - name: نصب وابستگی‌های موبایل
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: نصب Java 21 (Temurin) + کش Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: پذیرش لایسنس‌های Android SDK
        run: |
          if [ -d "$ANDROID_HOME/licenses" ] && [ -n "$(ls -A "$ANDROID_HOME/licenses" 2>/dev/null)" ]; then
            echo 'لایسنس‌ها از قبل فعال است'
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: رمزگشایی کلید امضا از Secret (در صورت وجود)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/karam-release.jks"
            echo "KARAM_SIGNING=true" >> "$GITHUB_ENV"
            echo 'کلید امضا آماده شد — هر دو Release امضاشده بیلد می‌شوند'
          else
            echo "KARAM_SIGNING=false" >> "$GITHUB_ENV"
            echo 'ℹ️ Secret کلید امضا تنظیم نشده — Release بدون امضا بیلد می‌شود'
          fi

      # ---------- ۱) حالت پیش‌فرض (پرداخت روشن) → karam-latest.apk ----------
      - name: ساخت بسته‌ی وب — حالت پیش‌فرض (پرداخت روشن)
        working-directory: mobile
        run: bun run build:www

      - name: همگام‌سازی Capacitor — حالت پیش‌فرض
        working-directory: mobile
        run: bunx cap sync android

      - name: بیلد APK حالت پیش‌فرض (Debug + Release)
        working-directory: mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          GRADLE_ARGS="assembleDebug assembleRelease --no-daemon --stacktrace"
          if [ "$KARAM_SIGNING" = "true" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PkaramKeystoreFile=$HOME/karam-release.jks -PkaramKeystorePassword=$KS_PASSWORD -PkaramKeyAlias=$KS_ALIAS -PkaramKeyPassword=$KS_KEY_PASSWORD"
          fi
          ./gradlew $GRADLE_ARGS

      - name: نگه‌داری خروجی حالت پیش‌فرض با نام نهایی
        run: |
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/release/app-release*.apk mobile/dist/karam-latest.apk
          echo 'karam-latest.apk (حالت پیش‌فرض — پرداخت روشن) آماده شد'

      # ---------- ۲) حالت bazaar (بدون پرداخت) → karam-bazaar.apk ----------
      - name: ساخت بسته‌ی وب — حالت bazaar (پرداخت حذف از باندل)
        working-directory: mobile
        run: bun run build:www:bazaar

      # v1.12.1 — سد صداقت باندل بازار: هیچ واژه‌ی پرداختی (درگاه/کارت‌به‌کارت/ارتقا به کارام پرو/زیبال)
      # در JS/HTML باندل بازار نباشد — شکست گام = شکست workflow و هیچ APK بازارِ پرداخت‌دار ساخته نمی‌شود
      - name: اسکن صداقت باندل بازار (بدون واژه‌های پرداخت)
        run: |
          MISSED=$(grep -rlE 'درگاه|کارت‌به‌کارت|کارت به کارت|ارتقا به کارام پرو|زیبال' mobile/www/assets mobile/www/terms mobile/www/privacy 2>/dev/null || true)
          if [ -n "$MISSED" ]; then
            echo '✗ واژه‌های پرداخت در باندل بازار پیدا شد — ساخت رد شد:' >&2
            echo "$MISSED" >&2
            exit 1
          fi
          echo '✅ باندل بازار پاک است — هیچ واژه‌ی پرداختی در JS/HTML نیست'

      - name: همگام‌سازی Capacitor — حالت bazaar
        working-directory: mobile
        run: bunx cap sync android

      - name: بیلد APK حالت bazaar (فقط Release)
        working-directory: mobile/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # خروجی قبلی را پاک کن تا مطمئن شویم فایل این حالت است (نه باقی‌مانده‌ی حالت قبل)
          rm -f app/build/outputs/apk/release/app-release*.apk
          GRADLE_ARGS="assembleRelease --no-daemon --stacktrace"
          if [ "$KARAM_SIGNING" = "true" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PkaramKeystoreFile=$HOME/karam-release.jks -PkaramKeystorePassword=$KS_PASSWORD -PkaramKeyAlias=$KS_ALIAS -PkaramKeyPassword=$KS_KEY_PASSWORD"
          fi
          ./gradlew $GRADLE_ARGS

      - name: نگه‌داری خروجی حالت bazaar با نام نهایی
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release*.apk mobile/dist/karam-bazaar.apk
          echo 'karam-bazaar.apk (حالت bazaar — بدون پرداخت) آماده شد'

      - name: خلاصه‌ی خروجی‌ها
        run: |
          ls -lh mobile/dist/
          echo 'هر دو APK از یک گریدل و یک کلید امضا بیلد شده‌اند (applicationId و versionCode یکسان).'

      - name: آپلود karam-latest.apk (پیش‌فرض — برای سایت و به‌روزرسانی)
        uses: actions/upload-artifact@v4
        with:
          name: karam-latest-apk
          path: mobile/dist/karam-latest.apk
          if-no-files-found: error

      - name: آپلود karam-bazaar.apk (نسخه‌ی بازار — بدون پرداخت)
        uses: actions/upload-artifact@v4
        with:
          name: karam-bazaar-apk
          path: mobile/dist/karam-bazaar.apk
          if-no-files-found: error

      - name: آپلود APK دیباگ (برای تست روی گوشی — از حالت پیش‌فرض)
        uses: actions/upload-artifact@v4
        with:
          name: karam-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
